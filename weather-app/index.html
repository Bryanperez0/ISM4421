<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owl Weather | FAU Boca Raton</title>
  <meta name="description" content="Current weather and 7-day forecast for FAU in Boca Raton, powered by Open-Meteo.">
  <meta name="theme-color" content="#003366">
  <link rel="icon" href="assets/fau-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="assets/fau-logo.svg" alt="FAU logo" class="brand-logo" width="56" height="56">
      <div>
        <h1 class="brand-title">Owl Weather</h1>
        <p class="brand-sub">Florida Atlantic University</p>
      </div>
    </div>
    <div class="unit-toggle" role="group" aria-label="Temperature units">
      <button type="button" data-unit="fahrenheit" class="active" aria-pressed="true">&deg;F</button>
      <button type="button" data-unit="celsius" aria-pressed="false">&deg;C</button>
    </div>
  </header>

  <main class="container">
    <form id="search-form" class="search" autocomplete="off">
      <label for="search-input" class="visually-hidden">Search for a city</label>
      <input id="search-input" type="search" placeholder="Search a city (e.g. Miami, Jupiter, Tampa)">
      <button type="submit" class="btn btn-primary">Search</button>
      <button type="button" id="locate-btn" class="btn btn-ghost" title="Use my location">My location</button>
      <button type="button" id="home-btn" class="btn btn-ghost" title="Back to FAU Boca Raton">FAU Boca</button>
      <ul id="search-results" class="search-results" hidden></ul>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="current" class="card current" hidden>
      <div class="current-top">
        <div>
          <h2 id="place-name" class="place-name"></h2>
          <p id="place-time" class="place-time"></p>
        </div>
        <div class="current-icon" id="current-icon" aria-hidden="true"></div>
      </div>
      <div class="current-main">
        <span id="current-temp" class="current-temp"></span>
        <div>
          <p id="current-desc" class="current-desc"></p>
          <p id="current-feels" class="current-feels"></p>
          <p id="current-hilo" class="current-feels"></p>
        </div>
      </div>
      <dl class="stats">
        <div><dt>Humidity</dt><dd id="stat-humidity"></dd></div>
        <div><dt>Wind</dt><dd id="stat-wind"></dd></div>
        <div><dt>Rain chance</dt><dd id="stat-precip"></dd></div>
        <div><dt>UV index</dt><dd id="stat-uv"></dd></div>
        <div><dt>Sunrise</dt><dd id="stat-sunrise"></dd></div>
        <div><dt>Sunset</dt><dd id="stat-sunset"></dd></div>
      </dl>
    </section>

    <section class="card" id="hourly-card" hidden>
      <h3 class="card-title">Next 24 hours</h3>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="card" id="daily-card" hidden>
      <h3 class="card-title">7-day forecast</h3>
      <ul id="daily" class="daily"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>Go Owls. Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0).</p>
    <p class="fine">Student project. Not an official Florida Atlantic University website.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
